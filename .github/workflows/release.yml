name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/setup

      - name: Build
        run: pnpm build

      - name: Version
        run: pnpm tegami ci version
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish
        run: pnpm tegami ci publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
