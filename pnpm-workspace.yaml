allowBuilds:
  esbuild: false
  msw: false
  node-pty: false
auditConfig:
  ignoreGhsas:
    # deepmerge prototype poisoning (low). Only reachable transitively via the
    # ultracite devDependency; no patched release exists for the 4.x line, so it
    # cannot be fixed via overrides. Not shipped in the published package.
    - GHSA-gcqx-w48m-w2h4
minimumReleaseAgeExclude:
  - commander@15.1.0
onlyBuiltDependencies:
  - node-pty
overrides:
  "diff@>=6.0.0 <8.0.3": ">=8.0.3"
  "shell-quote@<1.11.0": ">=1.11.0"
  "ws@>=7.0.0 <8.21.0": ">=8.21.0"
  "vite@>=8.0.0 <8.1.6": ">=8.1.6"
  "@hono/node-server@<2.1.3": ">=2.1.3"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "postcss@<=8.5.22": ">=8.5.23"
  "nanoid@<3.3.17": ">=3.3.17"
  "hono@<4.13.11": ">=4.13.11"
  "source-map-js@<1.2.2": ">=1.2.2"
  "zod@<4.6.6": ">=4.6.6"
